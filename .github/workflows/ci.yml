name: UMAA SDK + Independent Simulator / cross-platform prototype

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Prototype checks / ${{ matrix.os }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: default
          - os: ubuntu-24.04
            compiler: clang
          - os: windows-2022
            compiler: default
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify C++ library, dynamic modules, generator, independent simulator
        run: python tools/ci_verify.py --compiler ${{ matrix.compiler }}
      - name: Validate official service catalog, typed generation, and inventory
        run: |
          python -m unittest discover -s sdk/tests -p test_official_service_types.py -v
          python -m unittest discover -s sdk/tests -p test_reviewed_service_bindings.py -v
          python -m unittest discover -s sdk/tests -p test_official_inventory.py -v
          python -m unittest discover -s sdk/tests -p test_generate_reviewed_type_support.py -v
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umaa-prototype-${{ matrix.os }}-${{ matrix.compiler }}-evidence
          path: evidence/ci/
          if-no-files-found: warn

# This workflow verifies SYNTHETIC IDL + core prototype + stdio simulation.
# It does not validate real Cyclone / RTI DDS or official UMAA conformance.
