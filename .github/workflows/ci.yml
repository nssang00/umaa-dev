name: UMAA dynamic module cross-platform smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-module:
    name: service DLL/SO / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
          - os: ubuntu-24.04
            compiler: clang
          - os: windows-2022
            compiler: msvc
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            cmake -S smoke -B build/native -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          else
            cmake -S smoke -B build/native -DCMAKE_BUILD_TYPE=Debug
          fi
      - name: Build
        run: cmake --build build/native --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build/native --build-config Debug --output-on-failure
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-module-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/native/Testing/Temporary/
          if-no-files-found: ignore
# This job verifies only native module ABI load/unload, NOT UMAA DDS/IDL compliance.
