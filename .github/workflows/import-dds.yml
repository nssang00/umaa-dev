name: Import real Cyclone DDS test sources
on:
  push:
    paths:
      - .github/workflows/import-dds.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle and unpack
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, pathlib, tarfile
          packed = base64.b64decode(pathlib.Path('bootstrap/dds-real-demo.b64').read_text().strip(), validate=True)
          expected = '348ce52a33cbb3bffe32ce8d886bb12c18c7084dddc83114dacdfca0526b8b62'
          digest = hashlib.sha256(packed).hexdigest()
          assert digest == expected, digest
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as archive:
              members = archive.getmembers()
              assert len(members) == 6
              for m in members:
                  rel = pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not rel.is_absolute() and '..' not in rel.parts
                  assert str(rel).startswith(('dds/cyclone/', 'simulator/dds/'))
                  dest = pathlib.Path(m.name)
                  assert not dest.exists()
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.extractfile(m).read())
          print('SHA256 PASS:', digest, '; extracted:', len(members))
          PY
      - name: Push source integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dds/ simulator/dds/
          git diff --cached --check
          git commit -m "Add independent real Cyclone DDS Report wire test"
          git push origin HEAD:main
