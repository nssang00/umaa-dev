name: Import official UMAA DDS adapter tests
on:
  push:
    paths:
      - '.github/workflows/import-official-wire.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack new test sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,lzma,pathlib,tarfile
          packed=base64.b64decode(pathlib.Path('bootstrap/official-wire.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(packed).hexdigest() == '33c804e9d2533b3ad39ef49a83419146f298cdd9dc08a89743be6117cb726449'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)),mode='r:') as tar:
              members=tar.getmembers()
              assert len(members)==2
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts
                  assert str(p).startswith(('dds/cyclone/src/','simulator/dds/'))
                  dst=pathlib.Path(*p.parts)
                  assert not dst.exists()
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(tar.extractfile(m).read())
          print('OFFICIAL_SOURCE_IMPORT_SHA256_OK')
          PY
      - name: Commit integration files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dds/cyclone/src/official_battery_publisher.cpp simulator/dds/official_battery_subscriber.c
          git diff --cached --check
          git commit -m "Add official UMAA BatteryStatus DDS plugin and simulator test sources"
          git push origin HEAD:main
